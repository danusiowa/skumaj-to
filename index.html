<style>:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}*,*::before,*::after{box-sizing:inherit}body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style>
<title>Skumaj to!</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Playpen+Sans:wght@500;700;800&family=Andika:wght@400;700&display=swap">
<style>
/* Układ: jedna kolumna jak ekran telefonu; kremowa kartka, kolorowe kafelki z kolorowym napisem, żabka-doodle. Celowo jeden, jasny motyw. */
:root{
  --kartka:#FFF8EE; --staw:#008471; --zakreslacz:#D6D35F; --slonko:#F4D242; --piwonia:#FFC0C0;
  --pomidor:#C45F3F; --lawenda:#D1CAEA; --niebo:#80B0E8; --guma:#F29CC3; --rzesa:#898E46;
  --linia:#E8DCCB; --szary:#5E6B57; --fiolet-ink:#4A3F6B; --bialy:#FFFFFF; --puste:#EADFCB;
  --mega:"Playpen Sans","Comic Sans MS","Trebuchet MS",sans-serif; --tekst:"Andika","Trebuchet MS",Arial,sans-serif;
  color-scheme:light;
}
*,*::before,*::after{box-sizing:border-box}
html,body{min-height:100%}
body{background:var(--kartka);color:var(--staw);font-family:var(--tekst);font-size:16px;line-height:1.45;padding-inline:16px;padding-block:0}
#app{max-width:440px;margin:0 auto;min-height:calc(100vh - env(safe-area-inset-top, 0px) - env(safe-area-inset-bottom, 0px));min-height:calc(100dvh - env(safe-area-inset-top, 0px) - env(safe-area-inset-bottom, 0px));display:flex;flex-direction:column}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none;padding:0;touch-action:manipulation;-webkit-tap-highlight-color:transparent}
button:focus-visible,input:focus-visible,a:focus-visible{outline:3px solid var(--slonko);outline-offset:2px}
.mega{font-family:var(--mega);font-weight:800;letter-spacing:0}
.top{display:flex;align-items:center;gap:10px;padding:10px 16px;margin:0 -16px 14px;background:var(--staw);color:var(--kartka);border-radius:0 0 22px 22px}
.top .logo{width:46px;height:46px;border-radius:50%;background:var(--kartka);display:grid;place-items:center;flex:none}
.top svg{width:32px;height:38px}
.top .mega{font-size:17px;color:var(--zakreslacz)}
.top .wyloguj{margin-left:auto;display:inline-flex;align-items:center;gap:6px;min-height:40px;padding:0 14px;border-radius:99px;background:rgba(255,248,238,.14);color:var(--kartka);font-weight:700;font-size:13px}
.top .wyloguj svg{width:16px;height:16px}
.top .wyloguj + .wyloguj{margin-left:0}
.top .wyloguj.zapr{background:var(--zakreslacz);color:var(--staw)}
@media (max-width:420px){.top .wyloguj.zapr span{display:none}.top .wyloguj.zapr{padding:0 12px}}
.screen{display:flex;flex-direction:column;gap:14px;flex-grow:1;padding-bottom:18px}
.hero{position:relative;border-radius:24px;background:var(--lawenda);padding:20px 18px;min-height:150px;display:flex;flex-direction:column;justify-content:space-between;gap:14px}
.hero h1{margin:0;max-width:60%;font-size:23px;line-height:1.15;text-wrap:balance}
.hero .frog{position:absolute;right:10px;bottom:16px;width:120px;height:157px;z-index:1}
.hero{--mx:73px;--my:84px}
/* Akcenty sezonowe: tło karty, rzeczy obok żabki, konfetti. Tekst zostaje nad tłem. */
.hero > h1,.hero > .stan,.hero > .pills,.hero > .podpis{position:relative;z-index:2}
.hero .podpis{margin:-10px 0 0;font-size:14px;font-weight:700;color:var(--pomidor);max-width:60%}
.h-tlo{position:absolute;inset:0;border-radius:inherit;overflow:hidden;z-index:0;pointer-events:none}
.h-fuji{position:absolute;right:36px;bottom:0;width:216px;height:90px}
.spad{display:none;position:absolute;top:-30px;width:calc(18px * var(--k))}
.spad i{display:block}
.spad svg{display:block;width:100%;height:auto}
.spad.snieg b{display:block;width:calc(9px * var(--k));height:calc(9px * var(--k));border-radius:50%;background:#fff;box-shadow:0 0 0 1.5px #B8AEDB}
.h-zuraw{position:absolute;top:58px;right:14px;width:36px}
.h-slonce{position:absolute;top:14px;right:16px;width:36px;height:36px}
.h-zuraw svg{display:block;width:100%;height:auto}
.h-konf{position:absolute;right:var(--mx);bottom:calc(var(--my) + 34px);width:0;height:0;z-index:3;pointer-events:none}
.h-konf i{position:absolute;width:6px;height:10px;border-radius:2px;opacity:0}
.h-rzecz{position:absolute;z-index:2;pointer-events:none;display:block}
.h-rzecz svg{position:relative;display:block;width:100%;height:auto}
.rz-cien{position:absolute;left:6%;right:6%;bottom:-4px;height:9px;border-radius:50%;background:rgba(74,63,107,.28);filter:blur(1.5px)}
.h-nietoperz{position:absolute;top:18px;right:22%;width:46px}
.h-nietoperz svg{display:block;width:100%;height:auto}
.h-rzecz.l{right:94px;bottom:14px;width:40px}
.h-rzecz.l.choinka{width:44px;bottom:12px;z-index:0}
.h-rzecz.l.dynia{right:140px;width:46px;bottom:16px}
.h-rzecz.p{right:4px;bottom:12px;width:30px}
.h-mucha,.h-jezyk,.h-usta,.h-czubek{display:none}
@media (prefers-reduced-motion:no-preference){
  .h-mucha{display:block;position:absolute;right:calc(var(--mx) - 9px);bottom:calc(var(--my) - 9px);width:18px;height:18px;z-index:3;opacity:0;animation:muchaLot 12s linear infinite}
  .h-mucha .h-skrz{transform-box:fill-box;transform-origin:50% 100%;animation:flap .1s linear infinite alternate}
  .h-usta{display:block;position:absolute;right:calc(var(--mx) - 9px);bottom:calc(var(--my) - 8px);width:18px;height:14px;border-radius:50%;background:#6B2433;box-shadow:0 0 0 2.5px #008471;z-index:2;opacity:0;transform:scale(.3);animation:usta 12s ease-out infinite}
  .h-jezyk{display:block;position:absolute;right:var(--mx);bottom:calc(var(--my) - 3.5px);width:70px;height:7px;border-radius:4px;background:#F29CC3;box-shadow:inset 0 0 0 1.4px #C45F7F;transform-origin:100% 50%;transform:scaleX(0);z-index:3;animation:jezyk 12s linear infinite}
  .h-czubek{display:block;position:absolute;right:calc(var(--mx) - 6.5px);bottom:calc(var(--my) - 6.5px);width:13px;height:13px;border-radius:50%;background:#F29CC3;box-shadow:inset 0 0 0 1.4px #C45F7F;z-index:3;opacity:0;animation:czubek 12s linear infinite}
}
@keyframes muchaLot{
  0%{transform:translate(30px,-118px);opacity:0}
  5%{opacity:1}
  22%{transform:translate(-55px,-98px)}
  40%{transform:translate(-82px,-52px)}
  55%{transform:translate(-30px,-80px)}
  66%{transform:translate(-84px,-22px)}
  73.2%{transform:translate(-70px,0);opacity:1}
  73.8%{transform:translate(-70px,0)}
  75.6%{transform:translate(-6px,0) scale(.45);opacity:1}
  76.5%{transform:translate(0,0) scale(.3);opacity:0}
  100%{transform:translate(0,0) scale(.3);opacity:0}
}
@keyframes jezyk{0%,72%{transform:scaleX(0)}73.2%,73.8%{transform:scaleX(1)}75.8%{transform:scaleX(.06)}76.5%,100%{transform:scaleX(0)}}
@keyframes czubek{0%,71.9%{transform:translateX(0);opacity:0}72%{transform:translateX(0);opacity:1}73.2%,73.8%{transform:translateX(-70px);opacity:1}75.8%{transform:translateX(-4px);opacity:1}76.5%,100%{transform:translateX(0);opacity:0}}
@keyframes usta{0%,71.2%{opacity:0;transform:scale(.3)}72%{opacity:1;transform:scale(1)}76%{opacity:1;transform:scale(1)}77.5%,100%{opacity:0;transform:scale(.3)}}
.hero .cien{position:absolute;right:32px;bottom:24px;width:84px;height:14px;border-radius:50%;background:rgba(74,63,107,.28);filter:blur(1.5px)}
.pill{align-self:flex-start;padding:5px 12px;border-radius:99px;background:var(--kartka);color:var(--pomidor);font-weight:700;font-size:13px;display:inline-flex;align-items:center;gap:6px}
.pills{display:flex;flex-direction:column;gap:6px;align-items:flex-start;max-width:60%}
.hero .stan{margin:0;max-width:58%;font-size:14px;font-weight:500;color:var(--fiolet-ink)}
.hero .frog{width:124px;height:144px}
svg.mucha{width:16px;height:16px;flex:none}
.blok{display:flex;flex-direction:column}
.blok-t{margin:4px 0 0;font-size:18px}
.tiles{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px;margin-top:8px}
.tile{position:relative;aspect-ratio:1;border-radius:18px;padding:14px;display:flex;flex-direction:column;justify-content:space-between;text-align:left;transition:transform .15s;cursor:pointer;overflow:hidden}
.tile.arch{opacity:.75}
.tile.arch.open{opacity:1}
.tmenu{position:absolute;inset:0;display:none;flex-direction:column;justify-content:center;align-items:stretch;gap:8px;padding:14px;background:var(--tb)}
.tile.open .tmenu{display:flex;animation:pop .25s ease}
.tb .ti,.tbtn .ti{width:15px;height:15px;flex:none}
.tbtn{display:inline-flex;align-items:center;justify-content:center;gap:6px}
.tb{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:44px;border-radius:99px;font-weight:700;font-size:14px;background:transparent;color:var(--tf);box-shadow:inset 0 0 0 2px var(--tf);padding:0 10px}
.tb.go{background:var(--tf);color:var(--tb);box-shadow:none}
.tq{font-weight:700;font-size:14px;text-align:center}
@media (hover:hover){.tile:hover .tmenu{display:flex}}
.tile:hover{transform:translateY(-2px)}
.tile .tname{display:flex;flex-direction:column;gap:4px}
.tile .tname small{font-size:12px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;opacity:.85}
.tile .mega{font-size:17px;line-height:1.25;overflow-wrap:anywhere}
.tile .foot{display:flex;justify-content:space-between;align-items:baseline;font-weight:700;font-size:13px;letter-spacing:.06em}
.strip{display:flex;gap:12px;align-items:center;padding:12px 14px;border-radius:16px;background:var(--rzesa);color:var(--kartka);font-size:14px;flex-wrap:wrap}
.strip .mega{font-size:13px;color:var(--piwonia)}
.btn{height:56px;border-radius:999px;background:var(--pomidor);color:var(--kartka);font-family:var(--mega);font-weight:800;font-size:16px;width:100%}
.btn.ghost{background:transparent;color:var(--staw);box-shadow:inset 0 0 0 2px var(--staw)}
.btn:disabled{opacity:.45;cursor:not-allowed}
.spacer{flex-grow:1}
nav.tabs{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));padding:10px 6px calc(14px + env(safe-area-inset-bottom, 0px));font-size:12px;text-align:center;position:sticky;bottom:0;background:var(--staw);margin:0 -16px;border-radius:22px 22px 0 0}
nav.tabs button{display:flex;flex-direction:column;align-items:center;gap:4px;color:#CFE6DF}
nav.tabs button i{width:44px;height:28px;border-radius:14px;display:grid;place-items:center}
nav.tabs button i svg{width:18px;height:18px}
nav.tabs button[aria-current="page"]{color:var(--zakreslacz);font-weight:700}
nav.tabs button[aria-current="page"] i{color:var(--staw)}
nav.tabs button[aria-current="page"] i{background:var(--zakreslacz)}
.save{font-size:12px;color:var(--szary);text-align:center}
/* zadanie */
.qhead{display:flex;align-items:center;justify-content:space-between;padding-top:20px}
.x{height:44px;padding:0 16px;border-radius:99px;display:inline-flex;align-items:center;gap:6px;background:var(--lawenda);color:var(--fiolet-ink);font-size:14px;font-weight:700}
.dots{display:grid;gap:4px}
.dots i{height:8px;border-radius:99px;background:var(--puste)}
.dots i.done{background:var(--staw)} .dots i.now{background:var(--slonko)}
.card{position:relative;border-radius:28px;background:var(--staw);color:var(--zakreslacz);padding:22px 20px 20px;min-height:290px;display:flex;flex-direction:column;justify-content:space-between;gap:12px}
.card .label{font-size:13px;letter-spacing:.04em}
.card .q{font-size:clamp(34px,13vw,54px);line-height:1.05;font-variant-numeric:tabular-nums;max-width:100%;overflow-wrap:anywhere}
.card .q.long{font-size:clamp(26px,8vw,36px);max-width:62%}
.card .ansrow{display:flex;align-items:center;gap:10px;max-width:62%}
.card .eq{font-size:40px}
.ans{min-width:104px;height:64px;padding:0 14px;border-radius:16px;background:var(--kartka);color:var(--staw);display:grid;place-items:center;font-family:var(--mega);font-weight:800;font-size:36px;box-shadow:inset 0 0 0 3px var(--zakreslacz)}
.ans2{min-width:76px;font:inherit;font-family:var(--mega);font-weight:800;font-size:34px;cursor:pointer;opacity:.75;box-shadow:inset 0 0 0 2px var(--zakreslacz)}
.ans2.akt{opacity:1;box-shadow:inset 0 0 0 4px var(--zakreslacz),0 0 0 3px var(--kartka)}
input.ans{font-size:22px;text-transform:none;width:100%;min-width:0;border:0;text-align:center}
input.ans:focus,input.ans:focus-visible{outline:none;box-shadow:inset 0 0 0 3px var(--slonko)}
.card .frog{position:absolute;right:12px;bottom:12px;width:104px;height:113px;filter:drop-shadow(0 6px 6px rgba(0,40,30,.3))}
.card.szeroka .ansrow{max-width:none}
.dykt{display:flex;align-items:center;gap:14px}
@media (max-width:759px){.dykt{padding-right:100px}}
.dykt-gra{width:84px;height:84px;flex:none;border-radius:50%;display:grid;place-items:center;background:var(--zakreslacz);color:var(--staw);box-shadow:0 0 0 5px rgba(214,211,95,.35);cursor:pointer}
.dykt-gra .ti{width:42px;height:42px}
.dykt-opis{display:flex;flex-direction:column;align-items:flex-start;gap:8px;font-size:14px;color:var(--kartka)}
.dykt-opis b{font-weight:700}
.dykt-wolno{padding:6px 12px;border-radius:99px;background:rgba(255,248,238,.16);color:var(--kartka);font-size:13px;font-weight:700;cursor:pointer}
@media (prefers-reduced-motion:no-preference){.dykt-gra.gra{animation:dyktPuls .6s ease-out}}
@keyframes dyktPuls{40%{transform:scale(1.08)}}
.card.szeroka .frog{top:16px;bottom:auto}
.hint{margin:6px 0 0;font-size:15px;color:var(--szary)}
.pad{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.pad button{height:60px;border-radius:18px;background:var(--bialy);box-shadow:inset 0 0 0 1.5px var(--linia);font-family:var(--mega);font-weight:800;font-size:24px;color:var(--staw)}
.pad button.ok{background:var(--pomidor);color:var(--kartka);box-shadow:none;font-size:20px}
.pad button.del{background:var(--kartka);font-size:22px}
.pad,.klaw{touch-action:manipulation;user-select:none;-webkit-user-select:none}
.ans.txt{min-width:120px;max-width:100%;height:auto;min-height:56px;padding:8px 14px;font-size:24px;line-height:1.15;display:inline-flex;align-items:center;justify-content:flex-start;overflow-wrap:break-word;word-break:normal}
.kursor{display:inline-block;width:3px;height:1.1em;margin-left:2px;border-radius:2px;background:var(--pomidor);flex:none}
@media (prefers-reduced-motion:no-preference){.kursor{animation:kursor 1s steps(1) infinite}}
@keyframes kursor{50%{opacity:0}}
.klaw{display:flex;flex-direction:column;gap:7px}
.kr{display:flex;gap:5px;justify-content:center}
.klaw button{flex:1 1 0;min-width:0;max-width:46px;height:52px;padding:0;border-radius:12px;background:var(--bialy);box-shadow:inset 0 0 0 1.5px var(--linia);font-family:var(--mega);font-weight:800;font-size:21px;color:var(--staw)}
.klaw button:active,.pad button:active{transform:translateY(1px);filter:brightness(.94)}
.wcard{min-height:230px}
.wcard .q.wq{max-width:68%;overflow-wrap:normal}
.opcje{display:flex;flex-direction:column;gap:10px}
.opcja{display:flex;align-items:center;justify-content:space-between;gap:12px;min-height:58px;padding:12px 16px;border-radius:18px;background:var(--bialy);box-shadow:inset 0 0 0 2px var(--linia);color:var(--staw);font-family:var(--mega);font-weight:800;font-size:19px;text-align:left;cursor:pointer}
.opcja .ti{width:22px;height:22px;flex:none;opacity:.55}
.opcja.akt{background:var(--zakreslacz);box-shadow:inset 0 0 0 3px var(--staw)}
.opcja.akt .ti{opacity:1}
.q-glosy{display:flex;gap:8px;margin-top:-4px;flex-wrap:wrap}
.q-glos{display:inline-flex;align-items:center;gap:6px;padding:6px 12px;border-radius:99px;background:rgba(255,248,238,.16);color:var(--kartka);font-size:13px;font-weight:700;cursor:pointer}
.q-glos .ti{width:20px;height:20px}
.klaw button.del{flex:1.7 1 0;max-width:78px;background:var(--kartka)}
.klaw .dol button{max-width:none;height:54px}
.klaw .dol button:first-child{flex:1 1 0;max-width:64px}
.klaw button.spacja{flex:4 1 0;font-size:15px;font-weight:700}
.klaw button.ok{flex:2 1 0;background:var(--pomidor);color:var(--kartka);box-shadow:none;font-size:19px}
.confirm{border-radius:16px;background:var(--lawenda);color:var(--fiolet-ink);padding:12px 14px;display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap;font-weight:500}
.confirm div{display:flex;gap:8px}
.confirm button{padding:8px 14px;border-radius:99px;font-weight:700;background:var(--kartka)}
.confirm button.go{background:var(--pomidor);color:var(--kartka)}
/* podsumowanie */
.score{position:relative;border-radius:28px;background:var(--zakreslacz);color:var(--staw);padding:20px;min-height:190px;display:flex;flex-direction:column;justify-content:space-between}
.score .big{font-size:56px;line-height:1;font-variant-numeric:tabular-nums}
.score .frog{position:absolute;right:12px;bottom:14px;width:104px;height:136px;filter:drop-shadow(0 6px 6px rgba(0,60,40,.25))}
.stats{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.stat{border-radius:20px;padding:14px;display:flex;flex-direction:column;gap:8px;min-width:0}
.stat .mega{font-size:12px}
.stat .v{font-family:var(--mega);font-weight:800;font-size:30px;line-height:1;font-variant-numeric:tabular-nums}
.stat small{font-size:12px}
.errs{display:flex;flex-direction:column;gap:8px}
.errs .mega.t{font-size:13px;color:var(--pomidor)}
.err{display:flex;flex-direction:column;gap:8px;padding:12px 14px;border-radius:16px;box-shadow:inset 0 0 0 1.5px var(--linia);background:var(--bialy)}
.e-pyt{font-family:var(--mega);font-weight:800;font-size:17px;font-variant-numeric:tabular-nums;overflow-wrap:anywhere}
.e-odp{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.e-odp > span{display:flex;flex-direction:column;gap:2px;min-width:0;padding:6px 10px;border-radius:12px}
.e-odp small{font-size:11px;font-weight:700;letter-spacing:.02em}
.e-odp b{font-family:var(--mega);font-weight:800;font-size:16px;font-variant-numeric:tabular-nums;overflow-wrap:anywhere;display:flex;align-items:center;gap:6px}
.e-zle{background:var(--piwonia);color:#7A2E1A}
.e-zle b{text-decoration:line-through;text-decoration-thickness:2px;font-weight:700}
.e-ok{background:#E9F1E2;color:var(--staw)}
.e-tez{font-size:12px;color:var(--szary)}
.wyn{display:flex;flex-direction:column;gap:6px;padding:10px 14px;border-radius:16px;box-shadow:inset 0 0 0 1.5px var(--linia);background:var(--bialy);color:var(--staw)}
.wyn.zle{box-shadow:inset 0 0 0 2px var(--piwonia)}
.wyn .w-pyt{font-size:14px;font-weight:700;color:var(--szary);display:flex;align-items:center;gap:8px;overflow-wrap:anywhere}
.wyn .w-odp{font-family:var(--mega);font-weight:800;font-size:17px;display:flex;align-items:center;gap:8px;overflow-wrap:anywhere}
.wyn .w-twoja{font-size:14px;font-weight:700;color:#7A2E1A}
.wyn .w-twoja s{text-decoration-thickness:2px}
.wyn .glosnik{margin:-4px 0}
/* kalendarz */
.cal{border-radius:24px;background:var(--bialy);box-shadow:inset 0 0 0 1.5px var(--linia);padding:14px 12px 16px;display:flex;flex-direction:column;gap:10px}
.calhead{display:flex;align-items:center;justify-content:space-between;padding:0 4px}

.runda-dnia{background:var(--kartka);border-radius:14px;overflow:hidden}

ul.zad{list-style:none;margin:0;padding:0 12px 10px;display:flex;flex-direction:column;gap:4px}

.glosnik{all:unset;cursor:pointer;display:inline-grid;place-items:center;width:30px;height:30px;margin:-6px 0;border-radius:50%;color:var(--staw);background:var(--bialy);box-shadow:inset 0 0 0 1.5px currentColor;flex:none}

.glosnik:focus-visible{outline:3px solid var(--pomidor);outline-offset:2px}
@media (prefers-reduced-motion:no-preference){.gra .ti{animation:gra .6s ease-out}}
@keyframes gra{40%{transform:scale(1.25)}}
@media (prefers-reduced-motion:no-preference){
.hero .frog{animation:heroZaba 6s ease-in-out infinite;transform-origin:50% 100%}
.hero .cien{animation:cienZaby 6s ease-in-out infinite}

.spad{display:block;animation:spad 10s linear infinite}
.spad i{animation:sway 2.6s ease-in-out infinite alternate}
.h-zuraw{animation:zuraw 14s ease-in-out infinite}
.zw-skrz{transform-box:fill-box;transform-origin:100% 100%;animation:zwSkrz .45s ease-in-out infinite alternate}
.h-konf i{animation:konf 6s ease-out infinite}
.h-rzecz svg{transform-origin:50% 100%;animation:rzeczHop 6s ease-in-out infinite}
.h-rzecz .rz-cien{animation:rzeczCien 6s ease-in-out infinite}
.h-nietoperz{animation:nietoperzLot 9s ease-in-out infinite}
.dy-swiatlo,.dy-blask{animation:migot 1.3s ease-in-out infinite alternate}
.nt-skrz{transform-box:fill-box;transform-origin:50% 60%;animation:ntSkrz .32s ease-in-out infinite alternate}
.lampka{animation:lampka 1.2s steps(1) infinite}.lampka.l1{animation-delay:-.4s}.lampka.l2{animation-delay:-.8s}
.gwiazda{transform-box:fill-box;transform-origin:50% 50%;animation:gwiazda 6s ease-in-out infinite}
.hero .nag-lisc{animation:nagLisc 6s linear infinite}
.hero .nag-snieg{transform-box:fill-box;transform-origin:50% 100%;animation:nagSnieg 6s ease-in-out infinite}
.hero .cz-pompon{transform-box:fill-box;transform-origin:50% 0;animation:pompon 6s ease-in-out infinite}
.hero .ame{transform-box:fill-box;transform-origin:20% 100%;animation:ame 6s ease-in-out infinite}
}
/* Rytm skoku żabki: 76% wybicie, 84% lądowanie. */
@keyframes spad{from{transform:translateY(0) rotate(0)}to{transform:translateY(360px) rotate(320deg)}}
@keyframes sway{from{transform:translateX(-10px)}to{transform:translateX(10px)}}
@keyframes zuraw{0%{transform:translate(0,0) scaleX(-1)}45%{transform:translate(-56px,26px) scaleX(-1)}50%{transform:translate(-56px,26px) scaleX(1)}95%{transform:translate(0,0) scaleX(1)}100%{transform:translate(0,0) scaleX(-1)}}
@keyframes zwSkrz{to{transform:scaleY(-.5)}}
@keyframes konf{0%,74%{opacity:0;transform:translate(0,0) rotate(0)}77%{opacity:1;transform:translate(0,0)}86%{opacity:1;transform:translate(var(--dx),var(--dy)) rotate(var(--r))}98%{opacity:0;transform:translate(calc(var(--dx) * 1.3),calc(var(--dy) + 70px)) rotate(calc(var(--r) * 2))}100%{opacity:0}}
@keyframes rzeczHop{0%,82%,100%{transform:none}86%{transform:translateY(-4px) scaleY(1.04)}90%{transform:scaleY(.96)}94%{transform:none}}
@keyframes migot{from{opacity:.5}to{opacity:1}}
@keyframes nietoperzLot{0%,100%{transform:translate(0,0)}25%{transform:translate(-40px,14px)}50%{transform:translate(-70px,2px)}75%{transform:translate(-30px,-6px)}}
@keyframes rzeczCien{0%,82%,100%{transform:none;opacity:1}86%{transform:scaleX(.85);opacity:.7}90%{transform:scaleX(1.05)}94%{transform:none}}
@keyframes ntSkrz{to{transform:scaleY(.35)}}
@keyframes lampka{50%{opacity:.3}}
@keyframes gwiazda{0%,74%,100%{transform:none}80%{transform:scale(1.45) rotate(25deg)}88%{transform:none}}
@keyframes nagLisc{0%,18%{transform:translate(-34px,-96px) rotate(-40deg);opacity:0}24%{opacity:1}36%{transform:translate(12px,-64px) rotate(25deg)}48%{transform:translate(-16px,-30px) rotate(-25deg)}60%,74%{transform:translate(0,0) rotate(-12deg);opacity:1}80%{transform:translate(26px,-40px) rotate(130deg);opacity:1}92%{transform:translate(52px,16px) rotate(230deg);opacity:0}100%{opacity:0;transform:translate(52px,16px)}}
@keyframes nagSnieg{0%{transform:scaleY(0);opacity:0}8%{opacity:1}70%,74%{transform:scaleY(1);opacity:1}80%{transform:translateY(-16px) scale(1.25,.6);opacity:0}100%{transform:scaleY(0);opacity:0}}
@keyframes pompon{0%,72%,100%{transform:none}78%{transform:translateY(5px)}84%{transform:translateY(-7px)}90%{transform:translateY(3px)}95%{transform:none}}
@keyframes ame{0%,72%,100%{transform:none}78%{transform:rotate(-10deg)}84%{transform:rotate(12deg)}90%{transform:rotate(-5deg)}95%{transform:none}}
@keyframes cienZaby{0%,100%{transform:none;opacity:1}20%{transform:scaleX(1.06)}40%{transform:translateX(-3px)}55%{transform:translateX(3px)}68%{transform:scaleX(1.1)}76%{transform:scale(.55);opacity:.45}84%{transform:scaleX(1.12);opacity:1}90%{transform:scale(.8);opacity:.75}95%{transform:none;opacity:1}}
/* Kotylion: wstążki podrywają się przy skoku (76%) i kołyszą po lądowaniu, w rytmie heroZaba. */
@keyframes kWstazki{0%,70%,100%{transform:none}76%{transform:scaleY(.6) rotate(-14deg)}82%{transform:scaleY(1.15) rotate(14deg)}88%{transform:rotate(-9deg)}93%{transform:rotate(5deg)}97%{transform:none}}
@keyframes heroZaba{0%,100%{transform:none}20%{transform:scale(1.03,.97)}40%{transform:rotate(-2deg)}55%{transform:rotate(2deg)}68%{transform:scale(1.05,.94)}76%{transform:translateY(-12px) scale(.97,1.04)}84%{transform:scale(1.04,.96)}90%{transform:translateY(-4px)}95%{transform:none}}

@keyframes bob{50%{transform:translateY(-3px)}}

<script>
/* =====================================================================
   ZAGADNIENIA
   Żeby dodać nowe zagadnienie, dopisz obiekt do listy TEMATY.
   - typ "liczby": odpowiedź wpisywana na klawiaturze z cyframi
   - typ "tekst":  odpowiedź wpisywana zwykłą klawiaturą
   Każde zadanie ma: klucz (unikalny w temacie), pytanie, odp.
   Kilka dobrych odpowiedzi rozdziel ukośnikiem: "mum / mother".
   ===================================================================== */
const DLUGOSC_RUNDY = 15;

const SLOWA_RODZINA = [
  ["mama","mum / mom / mother"],["tata","dad / father"],["siostra","sister"],["brat","brother"],
  ["babcia","grandma / grandmother"],["dziadek","grandpa / grandfather"],["ciocia","aunt"],["wujek","uncle"],
  ["kuzyn","cousin"],["rodzice","parents"],["syn","son"],["córka","daughter"],
  ["rodzina","family"],["dziecko","child"],["dziadkowie","grandparents"]
];

function lista(pary){ return pary.map(([pytanie, odp]) => ({ klucz: pytanie, pytanie, odp })); }

/* „od” = dzień, w którym temat pojawił się w apce. Wcześniejsze dni kalendarz pokazuje jako neutralne, nie jako opuszczone.
   Nowy temat: wpisz dzisiejszą datę. */
const TEMATY = [
  {
    id: "tabliczka", od: "2026-10-03", nazwa: "Matematyka: mnożenie do 100", typ: "liczby", polecenie: "Ile to jest?",
    tlo: "#008471", napis: "#D6D35F",
    zadania(){
      const out = [];
      for (let a = 1; a <= 10; a++) for (let b = 1; b <= 10; b++)
        out.push({ klucz: a + "x" + b, pytanie: a + " × " + b, odp: String(a * b),
          grupa: Math.min(a, b) + "x" + Math.max(a, b),           // 3×7 i 7×3 to ta sama „para”
          waga: (a === 1 || b === 1 || a === 10 || b === 10) ? 0.5 : 1 }); // łatwe rzadziej
      return out;
    }
  },
  {
    id: "dzielenie", od: "2026-10-03", nazwa: "Matematyka: dzielenie do 100", typ: "liczby", polecenie: "Ile to jest?",
    tlo: "#80B0E8", napis: "#16324F",
    zadania(){
      const out = [];
      for (let a = 1; a <= 10; a++) for (let b = 1; b <= 10; b++)
        out.push({ klucz: (a * b) + ":" + b, pytanie: (a * b) + " : " + b, odp: String(a),
          grupa: Math.min(a, b) + "x" + Math.max(a, b),           // 56 : 7 i 56 : 8 nie w jednej rundzie
          waga: (a === 1 || b === 1 || a === 10 || b === 10) ? 0.5 : 1 }); // łatwe rzadziej
      return out;
    }
  },
  {
    id: "reszta", od: "2026-10-04", nazwa: "Matematyka: dzielenie z resztą do 100", typ: "liczby", reszta: true, polecenie: "Podziel z resztą",
    tlo: "#C45F3F", napis: "#FFF8EE",
    zadania(){
      const out = [];
      for (let b = 2; b <= 10; b++) for (let q = 1; q <= 10; q++) for (let r = 1; r < b; r++) {
        const a = b * q + r; if (a > 100) continue;
        out.push({ klucz: a + ":" + b, pytanie: a + " : " + b, odp: q + " r. " + r,
          grupa: b + "|" + q,                                      // 17 : 5 i 18 : 5 nie w jednej rundzie
          waga: (q === 1 || b === 2 || b === 10) ? 0.5 : 1 });     // łatwe rzadziej
      }
      return out;
    }
  },
  {
    id: "ang-liczby", od: "2026-10-03", nazwa: "Angielski: liczby do 100", typ: "tekst", polecenie: "Napisz słowami po angielsku",
    tlo: "#F4D242", napis: "#00594F",
    zadania(){
      const jed = ["", "one", "two", "three", "four", "five", "six", "seven", "eight", "nine"];
      const nasty = ["ten", "eleven", "twelve", "thirteen", "fourteen", "fifteen", "sixteen", "seventeen", "eighteen", "nineteen"];
      const dzies = ["", "", "twenty", "thirty", "forty", "fifty", "sixty", "seventy", "eighty", "ninety"];
      const out = [];
      for (let n = 1; n <= 100; n++) {
        let odp;
        if (n < 10) odp = jed[n];
        else if (n < 20) odp = nasty[n - 10];
        else if (n === 100) odp = "one hundred / a hundred";
        else {
          const d = Math.floor(n / 10), j = n % 10;
          odp = j ? `${dzies[d]}-${jed[j]} / ${dzies[d]} ${jed[j]}` : dzies[d];
        }
        out.push({ klucz: String(n), pytanie: String(n), odp });
      }
      return out;
    }
  },
  {
    id: "ang-rodzina", od: "2026-10-03", nazwa: "Angielski: rodzina", typ: "tekst", polecenie: "Napisz po angielsku", wymowa: "en-GB",
    tlo: "#FFC0C0", napis: "#9C3A20",
    zadania(){ return lista(SLOWA_RODZINA); }
  },
  {
    // Dyktando: apka czyta słowo, dziecko wpisuje, co usłyszało. Te same słowa co w „rodzinie”.
    // Każdy wariant (mum, mother) to osobne zadanie, ale z jednej grupy, więc w rundzie jest tylko jeden.
    id: "ang-rodzina-sluch", od: "2026-10-05", nazwa: "Angielski: rodzina ze słuchu", typ: "tekst", dyktando: true, polecenie: "Posłuchaj i napisz", wymowa: "en-GB",
    tlo: "#D1CAEA", napis: "#4A3F6B",
    zadania(){
      const out = [];
      for (const [pl, en] of SLOWA_RODZINA)
        for (const slowo of en.split("/").map(x => x.trim()).filter(x => x !== "mom"))
          out.push({ klucz: slowo, pytanie: pl, odp: slowo, grupa: pl });
      return out;
    }
  },
  {
    // Dialogi do scenki na hiszpański (tylko teksty z zeszytu). Nic się tu nie pisze:
    // do pytania wybierz pasującą odpowiedź (pytanie napisane albo tylko słyszane)
    // albo do odpowiedzi wybierz pytanie. Każdy tekst można odsłuchać, stuknięta opcja czyta się na głos.
    id: "hisz-dialogi", od: "2026-10-06", nazwa: "Hiszpański: dialogi", typ: "wybor", dlugosc: 10, wymowa: "es-ES",
    tlo: "#E8483A", napis: "#FFE36E",
    zadania(){
      const D = [
        { g: "jak", p: ["¿Cómo estás?", "¿Qué tal?"], o: ["Estoy muy bien.", "Estoy genial.", "Estoy fatal.", "Así así."] },
        { g: "imie", p: ["¿Cómo te llamas?"], o: ["Me llamo Amelka, ¿y tú?", "Yo soy Amelka."] },
        { g: "skad", p: ["¿De dónde eres?"], o: ["Yo soy de Polonia. Soy polaca."] },
        { g: "lata", p: ["¿Cuántos años tienes?"], o: ["Tengo diez años."] }
      ];
      const los = a => a[Math.floor(Math.random() * a.length)];
      const opcje = (d, pole) => shuffle([los(d[pole]), ...D.filter(x => x !== d).map(x => los(x[pole]))]);
      const out = [];
      for (const d of D) for (const p of d.p) {
        out.push({ klucz: "o:" + p, pytanie: p, odp: d.o.join(" / "), polecenie: "Wybierz odpowiedź", mow: p, opcje: opcje(d, "o"), grupa: "o:" + p });
        out.push({ klucz: "s:" + p, pytanie: "🔊 " + p, odp: d.o.join(" / "), polecenie: "Posłuchaj i wybierz odpowiedź", mow: p, sluch: true, opcje: opcje(d, "o"), grupa: "o:" + p });
      }
      for (const d of D) for (const o of d.o) {
        out.push({ klucz: "z:" + o, pytanie: o, odp: d.p.join(" / "), polecenie: "Jakie to było pytanie?", mow: o, opcje: opcje(d, "p") });
      }
      return out;
    }
  }
];
/* Wymowa: czyta angielskie słówko głosem urządzenia (bez internetu, bez nagrań).
   Temat z polem wymowa: "en-GB" dostaje głośniczki w podsumowaniu i w kalendarzu. */
const MOWA = "speechSynthesis" in window && "SpeechSynthesisUtterance" in window;
function glosDla(lang){
  const g = MOWA ? speechSynthesis.getVoices() : [];
  const jezyk = lang.split("-")[0];
  return g.find(v => v.lang.replace("_", "-") === lang && /female|samantha|serena|kate|martha|google/i.test(v.name))
    || g.find(v => v.lang.replace("_", "-") === lang)
    || g.find(v => v.lang.toLowerCase().startsWith(jezyk));
}
if (MOWA) { speechSynthesis.getVoices(); speechSynthesis.addEventListener?.("voiceschanged", () => speechSynthesis.getVoices()); }
/* Tempo: zwykłe 0.85, „wolniej” 0.35. Safari na iPhonie/iPadzie spłaszcza skalę
   (mnoży przez swoje domyślne tempo), więc różnica musi być duża, żeby było ją słychać. */
const TEMPO_ZWYKLE = 0.85, TEMPO_WOLNE = 0.35;
function mow(tekst, lang, tempo, tekst2){
  if (!MOWA || !tekst) return;
  const zdanie = t => {
    const u = new SpeechSynthesisUtterance(t);
    u.lang = lang; u.rate = tempo || TEMPO_ZWYKLE; u.pitch = 1.05;
    const g = glosDla(lang); if (g) u.voice = g;
    return u;
  };

function ubCzesc(ref, tr, bezPlamy){
  return `<g transform="${tr || ""}">${bezPlamy ? "" : `<use href="#ub-${ref}" class="u-hl" stroke="none" transform="translate(4 4)"/>`}<use href="#ub-${ref}" class="u-ln"/></g>`;
}
// Co żabka ma na sobie: tylko zebrane ubranka. Dopóki córka nic nie zmieniła, nosi wszystko, co ma (najnowsze na każde miejsce).
function aktualnyStroj(){
  const n = postepNagrod()[1], out = {};
  if (!n) return out;
  if (!Zapis.stroj) { UBRANKA.slice(0, n).forEach(u => { out[u.slot] = u.id; }); return out; }
  for (const [slot, id] of Object.entries(Zapis.stroj)) {
    const i = UBRANKA.findIndex(u => u.id === id && u.slot === slot);
    if (i >= 0 && i < n) out[slot] = id;
  }
  return out;
}
function ubranieSVG(stroj, T, ax, fx, fy){
  let tyl = "", przod = "";
  const s = stroj || {};
  if (s.plecy) tyl += ubCzesc(s.plecy, T);
  if (s.glowa) tyl += ubCzesc(s.glowa, "");
  if (s.stopy) przod += ubCzesc(s.stopy + "-l", `translate(${-fx} ${fy})`) + ubCzesc(s.stopy + "-p", `translate(${fx} ${fy})`);
  if (s.plecy === "plecak") przod += ubCzesc("plecak-szelki", T, true);
  if (s.szyja) przod += ubCzesc(s.szyja, T);
  if (s.oczy) przod += ubCzesc(s.oczy, "", s.oczy === "okragle");
  if (s.reka) przod += ubCzesc(s.reka, `translate(${ax} 0)`);
  return { tyl: tyl ? `<g ${UB_LINIA}>${tyl}</g>` : "", przod: przod ? `<g ${UB_LINIA}>${przod}</g>` : "" };
}
function ikonaUbranka(u){
  const czesci = u.slot === "stopy" ? ubCzesc(u.id + "-l", "") + ubCzesc(u.id + "-p", "")

  return `<svg viewBox="${u.vb}" aria-hidden="true"><g ${UB_LINIA}>${czesci}</g></svg>`;
}

/* ETAPY NAGRÓD: dni z rundą ≥ 12/15 liczone po kolei. Najpierw staw (14), potem garderoba (15), potem jesienny staw (14).
   Kolejny etap pokazuje się dopiero po skompletowaniu poprzedniego; stare komplety można dalej oglądać. */
const ETAPY = [
  { id: "staw", nazwa: "Staw", ile: STAW.length },
  { id: "garderoba", nazwa: "Garderoba", ile: UBRANKA.length },
  { id: "jesien", nazwa: "Jesienny staw", ile: JESIEN.length }
];
function postepNagrod(){
  let n = dniStawu().size;
  return ETAPY.map((e, i) => { const m = i === ETAPY.length - 1 ? n : Math.min(e.ile, n); n = Math.max(0, n - e.ile); return Math.max(0, m); });
}
function biezacyEtap(){
  const p = postepNagrod();
  const i = ETAPY.findIndex((e, k) => p[k] < e.ile);
  return i === -1 ? ETAPY.length - 1 : i;
}
// Co przyniósł k-ty dobry dzień (do podsumowania rundy).
function nagrodaDnia(k){
  let i = k - 1;
  for (const [e, lista] of [["staw", STAW], ["garderoba", UBRANKA], ["jesien", JESIEN]]) {
    if (i < lista.length) {
      const ost = i === lista.length - 1;
      const tytul = e === "staw" ? (ost ? "Staw kompletny!" : "Nowość w stawie!")
        : e === "garderoba" ? (ost ? "Garderoba kompletna!" : "Nowe ubranko!")
        : (ost ? "Jesienny staw kompletny!" : "Nowość w jesiennym stawie!");
      const dalej = !ost ? "" : e === "staw" ? " Teraz zbierasz ubranka dla żabki." : e === "garderoba" ? " Do stawu przychodzi jesień." : "";
      return { tytul, nazwa: lista[i].nazwa + (dalej ? "." + dalej : ""), link: (e === "garderoba" && !ost) || (e === "staw" && ost) ? "zobacz garderobę ›" : "zobacz staw ›" };
    }
    i -= lista.length;
  }
  return { tytul: "Nowość w jesiennym stawie!", nazwa: i % 3 === 2 ? "Kasztan na trawie" : "Liść na trawie", link: "zobacz staw ›" };
}

function historiaZadan(temat){

    const ileTemu = rundy.length - 1 - idx;
    for (const z of r.zadania) {
      const x = h[z.klucz] || (h[z.klucz] = { seria: 0, ostatnio: null, ileTemu: 99 });

function zacznijRunde(tematId, zadaniaPoprawki){
  const t = tematById(tematId); if (!t) return;
  const lista = zadaniaPoprawki ? shuffle(zadaniaPoprawki) : wybierzZadania(t, t.dlugosc || DLUGOSC_RUNDY);

  pytanieOWyjscie = false; ekran = "zadanie"; render(); window.scrollTo({ top: 0 }); czytajZadanie();

/* Typ "wybor" (dialogi): nic się nie pisze.
   Stuknięcie opcji czyta ją na głos i zaznacza, „Dalej” zatwierdza. */
function zadanieWybor(){
  const t = R.temat, z = R.lista[R.i], n = R.lista.length;
  setTimeout(() => { if (R) R.pokazane = R.i; }, 0);
  const dots = R.lista.map((_, k) => `<i class="${k < R.i ? "done" : k === R.i ? "now" : ""}"></i>`).join("");
  const glosy = tekst => MOWA ? `<div class="q-glosy"><button class="q-glos" data-act="mow" data-txt="${esc(tekst)}" data-lang="${t.wymowa}" aria-label="Posłuchaj">${ICO_GLOSNIK}<span>posłuchaj</span></button><button class="q-glos" data-act="mow" data-txt="${esc(tekst)}" data-lang="${t.wymowa}" data-tempo="${TEMPO_WOLNE}" aria-label="Posłuchaj wolniej">🐢 wolniej</button></div>` : "";

    : `<div class="mega q long wq">${esc(z.mow)}</div>${glosy(z.mow)}`;
  const dol = `<div class="opcje" role="radiogroup">${z.opcje.map((o, k) => `<button class="opcja${R.wybor === o ? " akt" : ""}" role="radio" aria-checked="${R.wybor === o}" data-act="opcja" data-k="${k}"><span>${esc(o)}</span>${MOWA ? ICO_GLOSNIK : ""}</button>`).join("")}</div>
       <button class="btn" data-act="ok" ${R.wybor ? "" : "disabled"}>Dalej</button>`;
  return `
  <div class="qhead">
    <span class="mega" style="font-size:14px">${R.i + 1} / ${n}</span>
    <button class="x" data-act="wyjdz">✕ Przerwij</button>
  </div>
  <main class="screen" style="padding-top:10px">
    <div class="dots" style="grid-template-columns:repeat(${n},minmax(0,1fr))" aria-hidden="true">${dots}</div>
    ${pytanieOWyjscie ? `<div class="confirm"><span>Przerwać rundę? Wynik się nie zapisze.</span><div><button data-act="zostan">Zostaję</button><button class="go" data-act="przerwij">Przerwij</button></div></div>` : ""}
    <section class="card szeroka wcard${R.pokazane !== R.i ? " pop" : ""}">
      <span class="mega label">${esc(z.polecenie)}</span>

}
function wybierzOpcje(k){
  const z = R.lista[R.i]; const o = z.opcje[k]; if (!o) return;
  R.wybor = o; render(); mow(o, R.temat.wymowa);
}
function zatwierdzWybor(ok, wpis){
  const z = R.lista[R.i], teraz = Date.now();
  R.odpowiedzi.push({ klucz: z.klucz, pytanie: z.sluch ? "🔊 " + z.mow : z.mow, odp: z.odp, wpis, dobrze: ok, ms: teraz - R.tZad });
  R.tZad = teraz; R.wybor = null; R.i++;
  if (R.i >= R.lista.length) return zakonczRunde();
  render(); czytajZadanie();
}

/* Własna klawiatura z literami: telefon nie wysuwa swojej, a układ jest zawsze ten sam. */
const RZEDY = ["qwertyuiop", "asdfghjkl", "zxcvbnm"];
function klawiatura(){
  const k = l => `<button data-act="litera" data-l="${l}" aria-label="${l}">${l}</button>`;
  return `<div class="klaw" role="group" aria-label="Klawiatura">
    <div class="kr">${[...RZEDY[0]].map(k).join("")}</div>
    <div class="kr">${[...RZEDY[1]].map(k).join("")}</div>
    <div class="kr">${[...RZEDY[2]].map(k).join("")}<button class="del" data-act="usun" aria-label="Usuń literę">⌫</button></div>
    <div class="kr dol"><button data-act="litera" data-l="-" aria-label="Myślnik">-</button><button class="spacja" data-act="litera" data-l=" " aria-label="Spacja">spacja</button><button class="ok" data-act="ok" aria-label="Zatwierdź">OK</button></div>
  </div>`;
}
function wpiszLitere(l){
  if (R.input.length >= 40) return;
  if (l === " " && (!R.input || R.input.endsWith(" "))) return;
  R.input += l; render();
}

function zatwierdz(){
  const z = R.lista[R.i];
  if (R.temat.typ === "wybor") {
    if (!R.wybor) return;
    return zatwierdzWybor(z.odp.split("/").map(norm).includes(norm(R.wybor)), R.wybor);
  }
  if (R.temat.reszta) {
    if ((R.pole || 0) === 0) { if (R.input) { R.pole = 1; render(); } return; }
    if (!R.input) { R.pole = 0; render(); return; }
    if (!R.reszta) return;
  }
  const wpis = R.temat.reszta ? R.input + " r. " + R.reszta : R.input.trim(); if (!wpis) return;
  const dobre = z.odp.split("/").map(norm).filter(Boolean);
  const ok = dobre.includes(norm(wpis)) || norm(wpis) === norm(z.odp);
  const teraz = Date.now();
  R.odpowiedzi.push({ klucz: z.klucz, pytanie: z.pytanie, odp: z.odp, wpis, dobrze: ok, ms: teraz - R.tZad });
  R.tZad = teraz; R.input = ""; R.reszta = ""; R.pole = 0; R.i++;
  if (R.i >= R.lista.length) return zakonczRunde();
  render();
  czytajZadanie();
}

function zakonczRunde(){
  const teraz = new Date();
  const runda = {
    id: teraz.getTime().toString(36) + Math.random().toString(36).slice(2, 7),
    data: teraz.toISOString(), dzien: dzienKlucz(teraz),
    temat: R.temat.id, rodzaj: R.rodzaj, zadania: R.odpowiedzi,
    dobre: R.odpowiedzi.filter(o => o.dobrze).length, wszystkie: R.odpowiedzi.length,
    ms: teraz.getTime() - R.start
  };
  ostatnia = runda; R = null; ekran = "podsumowanie"; pokazWszystkieBledy = false;
  Zapis.dodaj(runda);
  render(); window.scrollTo({ top: 0 });
  if (runda.rodzaj === "runda") setTimeout(() => pokazToast(runda), 350);
}

/* Losowanie bez powtórek: każdy tekst pojawi się raz, zanim któryś wróci. */
function losuj(nazwa, lista){
  const klucz = "skumaj-teksty-" + nazwa;
  let uzyte = [];
  try { uzyte = JSON.parse(localStorage.getItem(klucz) || "[]"); } catch (e) {}
  let wolne = lista.map((_, i) => i).filter(i => !uzyte.includes(i));
  if (!wolne.length) { const ostatni = uzyte[uzyte.length - 1]; uzyte = []; wolne = lista.map((_, i) => i).filter(i => i !== ostatni); }
  const i = wolne[Math.floor(Math.random() * wolne.length)];
  uzyte.push(i);
  try { localStorage.setItem(klucz, JSON.stringify(uzyte)); } catch (e) {}
  return lista[i];
}
function pokazToast(r){
  const stary = document.querySelector(".toast"); if (stary) stary.remove();
  const ok = r.dobre >= progRundy(r.wszystkie);
  const tekst = r.dobre === r.wszystkie ? losuj("perfekt", TEKSTY_PERFEKCYJNE) : ok ? losuj("ok", TEKSTY_ZALICZONE) : losuj("nie", TEKSTY_NIEZALICZONE);
  const el = document.createElement("button");
  el.className = "toast " + (ok ? "ok" : "nie");
  el.setAttribute("role", "status");
  el.setAttribute("aria-label", tekst + " Stuknij, aby zamknąć.");
  el.innerHTML = `${frog(ok ? "aha" : "zakr", "tfrog")}<span><b>${ok ? "Zaliczone!" : "Tym razem nie wyszło"}</b>${esc(tekst)}</span>`;
  el.addEventListener("click", () => el.remove());
  document.body.appendChild(el);
  setTimeout(() => { el.classList.add("out"); setTimeout(() => el.remove(), 400); }, 5000);
}

/* Wyniki tematów z wymową (angielski, hiszpański): każde zadanie z rundy po kolei,
   dobre i złe, z głośnikami przy tym, co jest w języku obcym. */
function wynikiZGlosnikami(r, t){
  const g = tekst => t.wymowa ? glosnik(tekst, t.wymowa) : "";
  const obcePytanie = t.typ === "wybor";             // w dialogach pytanie też jest po hiszpańsku
  const wiersz = z => {
    const warianty = z.odp.split("/").map(x => x.trim()).filter(Boolean);
    const pyt = z.pytanie.replace(/^🔊\s*/, "");
    const dobra = z.dobrze ? z.wpis : warianty[0];
    const inne = warianty.filter(w => norm(w) !== norm(dobra));
    return `<div class="wyn${z.dobrze ? "" : " zle"}">
      <span class="w-pyt">${esc(pyt)}${obcePytanie ? g(pyt) : ""}</span>
      ${z.dobrze ? "" : `<span class="w-twoja">✗ <s>${esc(z.wpis)}</s></span>`}
      <span class="w-odp">✓ ${esc(dobra)}${g(dobra)}</span>
      ${inne.length && t.typ === "wybor" ? `<span class="e-tez">też: ${inne.map(esc).join(", ")}</span>` : ""}
    </div>`;
  };
  return `<section class="errs"><span class="mega t">Wyniki</span>${r.zadania.map(wiersz).join("")}</section>`;
}

  const dzis = new Date();
  if (!kal) kal = { r: dzis.getFullYear(), m: dzis.getMonth(), sel: null };
  if (!kal.filtr || !tematById(kal.filtr)) kal.filtr = (TEMATY.find(t => !Zapis.archiwum[t.id]) || TEMATY[0]).id;
  const F = kal.filtr;
  const tF = F ? tematById(F) : null;
  const [fBg, fFg] = tF ? kolorTematu(tF, TEMATY.indexOf(tF)) : [null, null];
  const s = seria(F), best = rekord(F);
  const zrobione = dniZCwiczeniem(F);
  const tematyDnia = {};
  for (const r of Zapis.rundy) (tematyDnia[r.dzien] = tematyDnia[r.dzien] || new Set()).add(r.temat);
  const nazwyDnia = k => { const set = tematyDnia[k]; return set ? TEMATY.filter(t => set.has(t.id)).map(t => t.nazwa).join(", ") : ""; };
  const pierwszy = new Date(kal.r, kal.m, 1);
  const dniWMies = new Date(kal.r, kal.m + 1, 0).getDate();
  const offset = (pierwszy.getDay() + 6) % 7;
  const dzisK = dzienKlucz(dzis);
  const biezacy = kal.r === dzis.getFullYear() && kal.m === dzis.getMonth();
  // Od kiedy liczymy dni: od pierwszej rundy w apce, ale nie wcześniej niż temat się pojawił.
  const pierwszaRunda = Zapis.rundy.length ? Zapis.rundy[0].dzien : null;
  const rundaTematu = (Zapis.rundy.find(r => r.temat === F) || {}).dzien;
  let start = pierwszaRunda && tF && tF.od && tF.od > pierwszaRunda ? tF.od : pierwszaRunda;
  if (rundaTematu && start && rundaTematu < start) start = rundaTematu;
  const nowyTemat = start && tF && tF.od === start && (!pierwszaRunda || tF.od > pierwszaRunda);
  let wMies = 0, dotad = 0, cells = "";
  for (let i = 0; i < offset; i++) cells += "<span></span>";
  for (let d = 1; d <= dniWMies; d++) {
    const k = kal.r + "-" + pad2(kal.m + 1) + "-" + pad2(d);
    const przyszly = k > dzisK, done = zrobione.has(k);
    const przedStartem = !start || k < start;
    if (done) wMies++;
    if (!przyszly && (!przedStartem || done)) dotad++;
    const cls = ["day", przyszly || (przedStartem && !done) ? "future" : done ? "done" : (k === dzisK ? "" : "miss"), k === dzisK ? "today" : "", k === kal.sel ? "sel" : ""].join(" ");
    const opis = `${d} ${MIESIACE_D[kal.m]}: ${przyszly ? "jeszcze przed nami" : done ? "ćwiczenie zrobione" : przedStartem ? (nowyTemat ? "tego tematu jeszcze nie było" : "przed pierwszą rundą") : "bez ćwiczenia"}`;
    const opisPelny = done ? opis + " (" + nazwyDnia(k) + ")" : opis;
    const kolko = przyszly || (przedStartem && !done) ? `<span class="${cls}" aria-label="${opis}">${d}</span>` : `<button class="${cls}" data-act="dzien" data-k="${k}" aria-label="${esc(opisPelny)}">${d}</button>`;
    cells += `<div class="dcell">${kolko}</div>`;
  }
  const minR = Zapis.rundy.length ? new Date(Zapis.rundy[0].data) : dzis;
  const moznaWstecz = kal.r > minR.getFullYear() || (kal.r === minR.getFullYear() && kal.m > minR.getMonth());
  const moznaDalej = !biezacy && pierwszy < dzis;
  // szczegóły wybranego dnia
  const rDnia = Zapis.rundy.filter(r => r.dzien === kal.sel && (!F || r.temat === F));
  const selD = new Date((kal.sel || dzisK) + "T12:00:00");
  const godz = r => { const d = new Date(r.data); return d.getHours() + ":" + pad2(d.getMinutes()); };
  const det = rDnia.length ? rDnia.map(r => {
    const otwarta = kal.otwarta === r.id;
    const wym = (tematById(r.temat) || {}).wymowa;
    const zadania = otwarta ? `<ul class="zad">${r.zadania.map(z => { const slowo = z.dobrze ? z.wpis : pierwszeSlowo(z.odp); return `<li class="${z.dobrze ? "ok" : "zle"}"><span>${esc(z.pytanie)} = ${esc(slowo)}${wym ? glosnik(slowo, wym) : ""}</span><span>${z.dobrze ? "✓" : "✗ wpisane: " + esc(z.wpis)}</span></li>`; }).join("")}</ul>` : "";
    return `<div class="runda-dnia">
      <button data-act="rozwin" data-id="${r.id}" aria-expanded="${otwarta}">
        <span class="rd-nazwa">${esc((tematById(r.temat) || {}).nazwa || r.temat)}${r.rodzaj === "poprawa" ? " · poprawa" : ""}</span>
        <span class="rd-wynik">${r.dobre}/${r.wszystkie}</span>
        <span class="rd-meta">${godz(r)} · ${czas(r.ms)} ${otwarta ? "▲" : "▼"}</span>
      </button>${zadania}
    </div>`;
  }).join("") : `<p>${kal.sel === dzisK ? "Dziś jeszcze nie było ćwiczeń." : "Tego dnia nie było ćwiczeń."}</p>`;
  return `${naglowek()}
  <main class="screen">
    <h1 class="mega" style="margin:4px 0 0;font-size:20px">Kalendarz</h1>
    <div class="filtry" role="group" aria-label="Pokaż ćwiczenie">
      ${TEMATY.map((t, i) => `<button data-act="filtr" data-t="${t.id}" aria-pressed="${F === t.id}" style="--fb:${kolorTematu(t, i)[0]};--ff:${kolorTematu(t, i)[1]}">${esc(t.nazwa)}</button>`).join("")}
    </div>
    <div class="stats">
      <div class="stat" style="background:var(--slonko);color:var(--staw)"><span class="mega">Seria</span><span class="v">${s} ${dniSlowo(s)}</span><small>Rekord: ${best} ${dniSlowo(best)}</small></div>
      <div class="stat" style="background:var(--staw);color:var(--zakreslacz)"><span class="mega">W tym miesiącu</span><span class="v">${wMies}/${dotad}</span><small style="color:var(--kartka)">dni z ćwiczeniem</small></div>
    </div>
    <section class="cal">
      <div class="calhead">
        <button data-act="mies" data-d="-1" aria-label="Poprzedni miesiąc" ${moznaWstecz ? "" : "disabled"}>‹</button>
        <span class="mega">${MIESIACE[kal.m]} ${kal.r}</span>
        <button data-act="mies" data-d="1" aria-label="Następny miesiąc" ${moznaDalej ? "" : "disabled"}>›</button>
      </div>
      <div class="grid7 wd" aria-hidden="true"><span>PN</span><span>WT</span><span>ŚR</span><span>CZ</span><span>PT</span><span>SB</span><span>ND</span></div>
      <div class="grid7">${cells}</div>
      <div class="legend"><span><i style="background:var(--niebo)"></i>ćwiczone</span><span><i style="background:var(--piwonia)"></i>nie ćwiczone</span></div>
      ${F ? "" : `<div class="legend"><span style="font-weight:700">Tematy:</span>${TEMATY.map((t, i) => `<span><i class="kr" style="background:${kolorTematu(t, i)[0]}"></i>${esc(t.nazwa)}</span>`).join("")}</div>`}
      ${kal.sel ? `<div class="detail" id="szczegoly">
        <div class="dethead"><span class="mega">${DNI[selD.getDay()]}, ${selD.getDate()} ${MIESIACE_D[selD.getMonth()]}</span><button class="tbtn" data-act="zamknij-dzien" aria-label="Zamknij szczegóły dnia">✕</button></div>
        ${det}
      </div>` : `<p class="hint" style="margin:0;text-align:center;font-size:13px">Stuknij w dzień, żeby zobaczyć wyniki.</p>`}
    </section>
  </main>
  ${zakladki("kalendarz")}`;
}

/* ===================== zdarzenia ===================== */
app.addEventListener("click", async e => {
  const b = e.target.closest("[data-act]"); if (!b || b.disabled) return;
  const a = b.dataset.act;
  if (a === "ekran") { wybranyTemat = null; pytanieArchiwum = null; widokEtapu = null; skPyt = skBrak = null; ekran = b.dataset.to; if (ekran === "kalendarz") kal = null; render(); window.scrollTo({ top: 0 }); }
  else if (a === "runda") zacznijRunde(b.dataset.t);
  else if (a === "opcja") wybierzOpcje(Number(b.dataset.k));
  else if (a === "etap") { widokEtapu = Number(b.dataset.e); render(); }
  else if (a === "ubierz") {
    const u = UBRANKA.find(x => x.id === b.dataset.u); if (!u) return;
    const st = { ...aktualnyStroj() };
    if (st[u.slot] === u.id) delete st[u.slot]; else st[u.slot] = u.id;
    Zapis.ustawStroj(st);
  }
  else if (a === "zdejmij") Zapis.ustawStroj({});
  else if (a === "sk-rzecz") skStukniecie(b.dataset.id);
  else if (a === "sk-kup") skKup();
  else if (a === "sk-nie") { skPyt = skBrak = null; render(); }
  else if (a === "sk-zaba") skZaba();
  else if (a === "mow") { mow(b.dataset.txt, b.dataset.lang, +b.dataset.tempo || 0, b.dataset.txt2); b.classList.remove("gra"); void b.offsetWidth; b.classList.add("gra"); }
  else if (a === "cyfra") wpiszCyfre(b.dataset.d);
  else if (a === "usun") usunCyfre();
  else if (a === "litera") wpiszLitere(b.dataset.l);
  else if (a === "pole") { R.pole = +b.dataset.p; render(); }
  else if (a === "ok") zatwierdz();
  else if (a === "wyjdz") { pytanieOWyjscie = true; render(); }
  else if (a === "zostan") { pytanieOWyjscie = false; render(); }
  else if (a === "przerwij") { R = null; pytanieOWyjscie = false; ekran = "start"; render(); }
  else if (a === "popraw") {
    const t = tematById(ostatnia.temat);
    const klucze = new Set(ostatnia.zadania.filter(z => !z.dobrze).map(z => z.klucz));
    zacznijRunde(ostatnia.temat, t.zadania().filter(z => klucze.has(z.klucz)));
  }
  else if (a === "mies") { let m = kal.m + Number(b.dataset.d), r = kal.r; if (m < 0) { m = 11; r--; } if (m > 11) { m = 0; r++; } kal = { r, m, sel: kal.sel, filtr: kal.filtr }; render(); }
  else if (a === "filtr") { kal.filtr = b.dataset.t; kal.otwarta = null; render(); }
  else if (a === "wybierz") { wybranyTemat = wybranyTemat === b.dataset.t ? null : b.dataset.t; pytanieArchiwum = null; render(); }
  else if (a === "pytaj-archiwum") { wybranyTemat = b.dataset.t; pytanieArchiwum = b.dataset.t; render(); }
  else if (a === "nie-archiwizuj") { pytanieArchiwum = null; render(); }
  else if (a === "archiwizuj") { pytanieArchiwum = null; wybranyTemat = null; Zapis.ustawArchiwum(b.dataset.t, true); }
  else if (a === "przywroc") { wybranyTemat = null; Zapis.ustawArchiwum(b.dataset.t, false); }
  else if (a === "wyloguj") { pytamWyloguj = false; ekran = "start"; Zapis.wyloguj(); }
  else if (a === "pokaz-haslo") {
    const inp = document.getElementById("l-haslo"); const pokaz = inp.type === "password";
    inp.type = pokaz ? "text" : "password"; b.textContent = pokaz ? "Ukryj" : "Pokaż";
    b.setAttribute("aria-pressed", String(pokaz)); b.setAttribute("aria-label", pokaz ? "Ukryj hasło" : "Pokaż hasło");
    inp.focus(); oczyZaby();
  }
  else if (a === "kopiuj-link") {
    const inp = document.getElementById("z-link");
    try { await navigator.clipboard.writeText(inp.value); b.textContent = "Skopiowano ✓"; }
    catch (err) { inp.select(); b.textContent = "Zaznaczone, skopiuj ręcznie"; }
  }
  else if (a === "udostepnij-link") { try { await navigator.share({ title: "Skumaj to!", text: "Zaproszenie do Skumaj to! 🐸", url: zaproszenieWynik.link }); } catch (err) {} }
  else if (a === "wszystkie-bledy") { pokazWszystkieBledy = true; render(); }
  else if (a === "dzien") { kal.sel = b.dataset.k; kal.otwarta = null; render(); const d = document.getElementById("szczegoly"); if (d) d.scrollIntoView({ behavior: "smooth", block: "nearest" }); }
  else if (a === "zamknij-dzien") { kal.sel = null; kal.otwarta = null; render(); }
  else if (a === "rozwin") { kal.otwarta = kal.otwarta === b.dataset.id ? null : b.dataset.id; render(); }
});
app.addEventListener("submit", async e => {
  if (e.target.id === "haslo") {
    e.preventDefault();
    const h1 = document.getElementById("h-1").value, h2 = document.getElementById("h-2").value;
    if (h1.length < 6) { bladHasla = "Hasło musi mieć co najmniej 6 znaków."; render(); return; }
    if (h1 !== h2) { bladHasla = "Hasła się różnią. Wpisz to samo dwa razy."; render(); return; }
    try { await Zapis.nadajHaslo(h1); bladHasla = ""; } catch (err) { bladHasla = "Nie udało się zapisać hasła. Spróbuj jeszcze raz."; }
    render(); return;
  }
  if (e.target.id === "zapros") {
    e.preventDefault();
    const email = document.getElementById("z-email").value.trim(); zaprosEmail = email;
    if (!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)) { bladZaproszenia = "Wpisz poprawny adres e-mail."; render(); return; }
    tworzeLink = true; bladZaproszenia = ""; zaproszenieWynik = null; render();
    try { zaproszenieWynik = await Zapis.zapros(email); }
    catch (err) { bladZaproszenia = err && err.message === "exists" ? "Ta osoba ma już konto w Skumaj to! Może się po prostu zalogować." : "Nie udało się utworzyć linku. Sprawdź internet i spróbuj ponownie."; }
    tworzeLink = false; render(); return;
  }
  if (e.target.id !== "logowanie") return;
  e.preventDefault();
  const email = document.getElementById("l-email").value.trim(), haslo = document.getElementById("l-haslo").value;
  if (!email || !haslo) { bladLogowania = "Wpisz e-mail i hasło."; render(); return; }
  logujeSie = true; bladLogowania = ""; Zapis.email = email; render();
  try { await Zapis.zaloguj(email, haslo); }
  catch (err) { bladLogowania = /invalid/i.test(err.message || "") ? "Nieprawidłowy e-mail albo hasło. Spróbuj jeszcze raz." : "Nie udało się zalogować. Sprawdź internet i spróbuj ponownie."; }
  logujeSie = false; render();
});
function oczyZaby(){
  const w = app.querySelector(".wejscie"); if (!w) return;
  const el = document.activeElement;
  const zamknij = !!el && el.type === "password" && w.contains(el);
  w.classList.toggle("oczy-zamkniete", zamknij);
}
app.addEventListener("focusin", oczyZaby);
app.addEventListener("focusout", () => setTimeout(oczyZaby, 0));
let ukryteOd = 0;
document.addEventListener("visibilitychange", () => {
  if (document.hidden) { ukryteOd = Date.now(); return; }
  if (R && ukryteOd) { const d = Date.now() - ukryteOd; R.start += d; R.tZad += d; }
  ukryteOd = 0;
});
/* Cyfry trafiają do aktywnego okienka: wynik albo (przy dzieleniu z resztą) reszta. */
function wpiszCyfre(d){
  if (R.temat.reszta && R.pole === 1) { if ((R.reszta || "").length < 2) R.reszta = (R.reszta || "") + d; }
  else if (R.input.length < 3) R.input += d;
  render();
}
function usunCyfre(){
  if (R.temat.reszta && R.pole === 1) { if (R.reszta) R.reszta = R.reszta.slice(0, -1); else R.pole = 0; }
  else R.input = R.input.slice(0, -1);
  render();
}
document.addEventListener("keydown", e => {
  if ((e.key === "Enter" || e.key === " ") && e.target.classList && e.target.classList.contains("tile")) { e.preventDefault(); e.target.click(); return; }
  if (ekran !== "zadanie" || !R) return;
  if (R.temat.typ === "wybor") {
    const z = R.lista[R.i];
    if (z && z.opcje && /^[1-9]$/.test(e.key)) wybierzOpcje(Number(e.key) - 1);
    else if (e.key === "Enter") { e.preventDefault(); zatwierdz(); }
  } else if (R.temat.typ === "liczby") {
    if (/^[0-9]$/.test(e.key)) wpiszCyfre(e.key);
    else if (e.key === "Backspace") usunCyfre();
    else if (R.temat.reszta && (e.key === "r" || e.key === "R" || e.key === "Tab" || e.key === "ArrowRight" || e.key === "ArrowLeft")) { e.preventDefault(); R.pole = e.key === "ArrowLeft" ? 0 : e.key === "ArrowRight" || e.key === "r" || e.key === "R" ? 1 : 1 - (R.pole || 0); render(); }
    else if (e.key === "Enter") { e.preventDefault(); zatwierdz(); }
  } else {
    if (e.ctrlKey || e.metaKey || e.altKey) return;
    if (/^[a-zA-Z\- ]$/.test(e.key)) { e.preventDefault(); wpiszLitere(e.key.toLowerCase()); }
    else if (e.key === "Backspace") { e.preventDefault(); usunCyfre(); }
    else if (e.key === "Enter") { e.preventDefault(); zatwierdz(); }
  }
});

render();
Zapis.start();
